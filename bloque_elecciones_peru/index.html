<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segunda vuelta presidencial Perú 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f3ee;
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrapper { width: 100%; max-width: 900px; }

    .encabezado { text-align: center; margin-bottom: 20px; }
    .encabezado .subtitulo {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c1002a;
      margin-bottom: 6px;
    }
    .encabezado h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 900;
      color: #1a1a1a;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .panel {
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    /* CANDIDATOS */
    .candidatos-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
    }

    .candidato {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .candidato.keiko { border-right: 1px solid #eee; }

    .candidato-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .candidato.sanchez .candidato-top {
      flex-direction: row-reverse;
      text-align: right;
    }

    .foto {
      width: 68px;
      height: 86px;
      object-fit: cover;
      object-position: top;
      border-radius: 3px;
      flex-shrink: 0;
      background: #eee;
    }

    .nombre {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 700;
      text-transform: uppercase;
      color: #1a1a1a;
      line-height: 1.2;
    }

    .partido {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .porcentaje-num {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(40px, 7vw, 60px);
      font-weight: 900;
      line-height: 1;
    }

    .candidato.keiko .porcentaje-num { color: #e05c00; }
    .candidato.sanchez .porcentaje-num { color: #c1002a; text-align: right; }

    .barra-track {
      height: 8px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }

    .barra-fill {
      height: 100%;
      border-radius: 99px;
      width: 0;
      transition: width 1.2s cubic-bezier(.4,0,.2,1);
    }

    .candidato.keiko .barra-fill { background: #e05c00; }
    .candidato.sanchez .barra-fill { background: #c1002a; }

    .votos-label {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .candidato.sanchez .votos-label { text-align: right; }

    /* CENTRO */
    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 10px;
      gap: 10px;
    }

    .vs-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #bbb;
    }

    .diferencia-box {
      background: #fff7f0;
      border: 1px solid #ffd0a0;
      border-radius: 4px;
      padding: 8px 10px;
      text-align: center;
      white-space: nowrap;
    }

    .diferencia-pct {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #e05c00;
    }

    .diferencia-votos {
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }

    /* DATOS FOOTER */
    .datos-footer {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid #eee;
    }

    .dato {
      padding: 12px 10px;
      text-align: center;
      border-right: 1px solid #eee;
    }

    .dato:last-child { border-right: none; }

    .dato-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #aaa;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .dato-valor {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* UPDATE BAR */
    .update-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: #1a1a1a;
      color: #888;
      font-size: 11px;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #4caf50;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* ESTADO CARGA / ERROR */
    .estado {
      padding: 48px 24px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .estado.error { color: #c1002a; }

    .estado-titulo {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      margin-bottom: 8px;
      color: #333;
    }

    .debug {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 4px;
      font-size: 11px;
      text-align: left;
      color: #666;
      word-break: break-all;
      max-width: 560px;
      margin-inline: auto;
    }

    /* RESPONSIVE */
    @media (max-width: 580px) {
      .candidatos-grid { grid-template-columns: 1fr; }

      .candidato.keiko { border-right: none; border-bottom: 1px solid #eee; }

      .candidato.sanchez .candidato-top { flex-direction: row; text-align: left; }
      .candidato.sanchez .porcentaje-num,
      .candidato.sanchez .votos-label { text-align: left; }

      .centro {
        flex-direction: row;
        justify-content: center;
        padding: 10px 16px;
        border-bottom: 1px solid #eee;
        order: -1;
      }

      .datos-footer { grid-template-columns: 1fr 1fr; }
      .dato:nth-child(2) { border-right: none; }
      .dato:nth-child(1),
      .dato:nth-child(2) { border-bottom: 1px solid #eee; }
      .dato:nth-child(4) { border-right: none; }
      .dato:nth-child(3),
      .dato:nth-child(4) { border-bottom: 1px solid #eee; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="encabezado">
    <div class="subtitulo">Resultados oficiales · ONPE</div>
    <h1>Segunda vuelta presidencial Perú 2026</h1>
  </div>
  <div class="panel" id="panel">
    <div class="estado" id="cargando">
      <div class="estado-titulo">Cargando resultados…</div>
      <div>Conectando con el servidor oficial de ONPE</div>
    </div>
  </div>
</div>

<script>
  // ─── URLs exactas confirmadas ─────────────────────────────────────────────
  const URL_PARTICIPANTES = "https://resultadosegundavuelta.onpe.gob.pe/presentacion-backend/resumen-general/participantes?idEleccion=10&tipoFiltro=eleccion";
  const URL_TOTALES       = "https://resultadosegundavuelta.onpe.gob.pe/presentacion-backend/resumen-general/totales?idEleccion=10&tipoFiltro=eleccion";

  // Proxy CORS: necesario cuando se sirve desde GitHub Pages u otro dominio.
  // allorigins.win devuelve { contents: "<json string>", status: { url, http_code } }
  function proxify(url) {
    return `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  }

  async function fetchJSON(url) {
    const res = await fetch(proxify(url));
    if (!res.ok) throw new Error(`Error HTTP ${res.status}`);
    const wrapper = await res.json();
    return JSON.parse(wrapper.contents);
  }

  // ─── Formato ──────────────────────────────────────────────────────────────
  const num   = n => new Intl.NumberFormat("es-PE").format(n ?? 0);
  const pct   = n => Number(n ?? 0).toFixed(2).replace(".", ",") + "%";
  const fecha = ms => new Date(ms).toLocaleString("es-PE", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });

  // ─── Render ───────────────────────────────────────────────────────────────
  function render(keiko, sanchez, totales) {
    const difPct   = Math.abs(keiko.porcentajeVotosValidos - sanchez.porcentajeVotosValidos);
    const difVotos = Math.abs(keiko.totalVotosValidos - sanchez.totalVotosValidos);
    const votosNulos = Math.max(0, (totales.totalVotosEmitidos ?? 0) - (totales.totalVotosValidos ?? 0));

    document.getElementById("panel").innerHTML = `
      <div class="candidatos-grid">

        <!-- KEIKO -->
        <div class="candidato keiko">
          <div class="candidato-top">
            <img class="foto" src="assets/img/keiko.png" alt="Keiko Fujimori"
                 onerror="this.style.display='none'">
            <div>
              <div class="nombre">${keiko.nombreCandidato}</div>
              <div class="partido">${keiko.nombreAgrupacionPolitica}</div>
            </div>
          </div>
          <div>
            <div class="porcentaje-num">${pct(keiko.porcentajeVotosValidos)}</div>
            <div class="barra-track">
              <div class="barra-fill" id="barra-keiko"></div>
            </div>
            <div class="votos-label">${num(keiko.totalVotosValidos)} votos válidos</div>
          </div>
        </div>

        <!-- CENTRO -->
        <div class="centro">
          <div class="vs-badge">VS</div>
          <div class="diferencia-box">
            <div class="diferencia-pct">${pct(difPct)}</div>
            <div class="diferencia-votos">${num(difVotos)} votos de diferencia</div>
          </div>
        </div>

        <!-- SÁNCHEZ -->
        <div class="candidato sanchez">
          <div class="candidato-top">
            <img class="foto" src="assets/img/sanchez.png" alt="Roberto Sánchez"
                 onerror="this.style.display='none'">
            <div>
              <div class="nombre">${sanchez.nombreCandidato}</div>
              <div class="partido">${sanchez.nombreAgrupacionPolitica}</div>
            </div>
          </div>
          <div>
            <div class="porcentaje-num">${pct(sanchez.porcentajeVotosValidos)}</div>
            <div class="barra-track">
              <div class="barra-fill" id="barra-sanchez"></div>
            </div>
            <div class="votos-label">${num(sanchez.totalVotosValidos)} votos válidos</div>
          </div>
        </div>

      </div>

      <div class="datos-footer">
        <div class="dato">
          <div class="dato-label">Actas procesadas</div>
          <div class="dato-valor">${pct(totales.actasContabilizadas)}</div>
        </div>
        <div class="dato">
          <div class="dato-label">Votos emitidos</div>
          <div class="dato-valor">${num(totales.totalVotosEmitidos)}</div>
        </div>
        <div class="dato">
          <div class="dato-label">Votos válidos</div>
          <div class="dato-valor">${num(totales.totalVotosValidos)}</div>
        </div>
        <div class="dato">
          <div class="dato-label">Votos nulos</div>
          <div class="dato-valor">${num(votosNulos)}</div>
        </div>
        <div class="dato">
          <div class="dato-label">Participación</div>
          <div class="dato-valor">${pct(totales.participacionCiudadana)}</div>
        </div>
      </div>

      <div class="update-bar">
        <span><span class="dot"></span>En vivo · actualiza cada 5 min</span>
        <span>${totales.fechaActualizacion ? "Últ. act.: " + fecha(totales.fechaActualizacion) : ""}</span>
      </div>
    `;

    // Animar barras después del render
    requestAnimationFrame(() => {
      document.getElementById("barra-keiko").style.width   = Math.min(100, keiko.porcentajeVotosValidos) + "%";
      document.getElementById("barra-sanchez").style.width = Math.min(100, sanchez.porcentajeVotosValidos) + "%";
    });
  }

  function mostrarError(msg) {
    document.getElementById("panel").innerHTML = `
      <div class="estado error">
        <div class="estado-titulo">No se pudieron cargar los datos</div>
        <div class="debug">${msg}<br><br>Abrí DevTools (F12 → Console o Network) para ver el error exacto.</div>
      </div>`;
  }

  // ─── Carga ────────────────────────────────────────────────────────────────
  async function cargar() {
    try {
      const [rPart, rTot] = await Promise.all([
        fetchJSON(URL_PARTICIPANTES),
        fetchJSON(URL_TOTALES)
      ]);

      if (!rPart.success) throw new Error("API participantes: success=false. " + rPart.message);
      if (!rTot.success)  throw new Error("API totales: success=false. " + rTot.message);

      const participantes = rPart.data;
      const totales       = rTot.data;

      // Buscar candidatos de forma robusta
      const keiko  = participantes.find(p => p.nombreCandidato.includes("KEIKO") || p.nombreCandidato.includes("FUJIMORI"));
      const sanchez = participantes.find(p => p.nombreCandidato.includes("SANCHEZ") || p.nombreCandidato.includes("SÁNCHEZ") || p.nombreCandidato.includes("ROBERTO"));

      if (!keiko || !sanchez) {
        const nombres = participantes.map(p => p.nombreCandidato).join(" | ");
        throw new Error(`Candidatos no encontrados en la respuesta. Nombres recibidos: ${nombres}`);
      }

      render(keiko, sanchez, totales);

    } catch (err) {
      mostrarError(err.message);
    }
  }

  cargar();
  setInterval(cargar, 300_000);
</script>
</body>
</html>
